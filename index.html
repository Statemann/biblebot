<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask the Bible</title>
<meta name="description" content="Bible questions answered with Scripture, context, and a clear view of where Christians agree and differ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F1; --ink:#1D2A27; --muted:#5C6B66; --rule:#D3D9D1;
  --accent:#254E9C; --accent-ink:#FFFFFF; --tint:#E2E8F3; --err:#9B2C2C;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#111816; --ink:#E4EBE7; --muted:#9AA9A3; --rule:#2A3632;
        --accent:#8FAEF0; --accent-ink:#0E1A33; --tint:#1E2A44; --err:#F0A0A0;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--ui);min-height:100dvh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:720px;padding:0 20px;flex:1;display:flex;flex-direction:column}
header{padding:calc(28px + env(safe-area-inset-top)) 0 14px}
h1{font:600 28px/1.15 var(--read);margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:15px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;padding:12px 0 14px;border-bottom:1px solid var(--rule)}
.controls label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
select,textarea,button{font:inherit;color:inherit}
select{background:transparent;border:1px solid var(--rule);border-radius:8px;padding:7px 10px;min-width:170px;color:var(--ink)}
.linkbtn{margin-left:auto;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:7px 0;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{flex:1;padding:22px 0 8px;display:flex;flex-direction:column;gap:22px}
.starters h2{font:600 18px/1.3 var(--read);margin:6px 0 10px}
.starters button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:13px 2px;cursor:pointer;font-size:16px}
.starters button:last-child{border-bottom:1px solid var(--rule)}
.starters button:hover{color:var(--accent)}
.msg.user{align-self:flex-end;max-width:85%;background:var(--tint);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{border-left:2px solid var(--rule);padding:2px 0 2px 16px;font:400 17px/1.7 var(--read);max-width:68ch;overflow-wrap:anywhere}
.msg.bot p{margin:0 0 .85em}
.msg.bot p:last-child,.msg.bot ul:last-child{margin-bottom:0}
.msg.bot ul{margin:0 0 .85em;padding-left:1.2em}
.msg.bot li{margin:0 0 .4em}
.msg.bot strong{font-weight:600}
.msg.err{border-left-color:var(--err);color:var(--err)}
.wait{color:var(--muted);font:15px var(--ui)}
.wait::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.wait::after{animation:none;content:"…"}}
form{position:sticky;bottom:0;background:var(--paper);padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--rule)}
textarea{flex:1;resize:none;background:transparent;border:1px solid var(--rule);border-radius:12px;padding:11px 14px;max-height:160px;line-height:1.4}
#send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 20px;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
.foot{max-width:720px;width:100%;padding:0 20px calc(18px + env(safe-area-inset-bottom));margin:0;color:var(--muted);font-size:12.5px}
@media (max-width:520px){select{min-width:0;width:100%}.controls label{flex:1 1 140px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ask the Bible</h1>
    <p>Scripture, context, and a clear view of where Christians agree and where they differ.</p>
  </header>

  <div class="controls">
    <label>Answer from
      <select id="tradition">
        <option value="overview">Balanced overview</option>
        <option value="evangelical">Evangelical</option>
        <option value="reformed">Reformed / Calvinist</option>
        <option value="pentecostal">Pentecostal / Charismatic</option>
        <option value="catholic">Roman Catholic</option>
        <option value="orthodox">Eastern Orthodox</option>
        <option value="anglican">Anglican</option>
        <option value="baptist">Baptist</option>
        <option value="methodist">Methodist / Wesleyan</option>
      </select>
    </label>
    <label>Quote from
      <select id="translation">
        <option value="web">WEB (World English Bible)</option>
        <option value="kjv">KJV</option>
        <option value="asv">ASV</option>
        <option value="webbe">WEB (British)</option>
      </select>
    </label>
    <button class="linkbtn" id="new" type="button">New conversation</button>
  </div>

  <main id="log" aria-live="polite" aria-label="Conversation"></main>

  <form id="composer">
    <textarea id="q" rows="1" maxlength="2000" placeholder="Ask a question about Scripture" aria-label="Your question"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<p class="foot">A study aid, not a replacement for your pastor or church. For personal, medical, or legal decisions, speak with someone who knows you.</p>

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};
  var log=$('#log'), q=$('#q'), sendBtn=$('#send'), trad=$('#tradition'), trans=$('#translation');
  var STARTERS=[
    "Is Jesus really God?",
    "What does the Bible teach about baptism?",
    "Is speaking in tongues for today?",
    "How should a Christian think about money?",
    "Can a woman be a pastor?",
    "What happens after we die?"
  ];
  var store={
    get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  var messages=store.get('msgs',[]); if(!Array.isArray(messages)) messages=[];
  var busy=false;

  trad.value=store.get('tradition','overview'); if(trad.value!==store.get('tradition','overview')) trad.value='overview';
  trans.value=store.get('translation','web'); if(!trans.value) trans.value='web';
  trad.onchange=function(){store.set('tradition',trad.value)};
  trans.onchange=function(){store.set('translation',trans.value)};

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function inline(s){
    return s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
            .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>');
  }
  function md(text){
    var html='', list=false, para=[];
    function flushP(){ if(para.length){html+='<p>'+para.join('<br>')+'</p>'; para=[];} }
    function closeL(){ if(list){html+='</ul>'; list=false;} }
    esc(text).split('\n').forEach(function(line){
      var m=line.match(/^\s*(?:[-\u2022]|\d+\.)\s+(.*)$/);
      if(m){ flushP(); if(!list){html+='<ul>'; list=true;} html+='<li>'+inline(m[1])+'</li>'; }
      else if(!line.trim()){ flushP(); closeL(); }
      else { closeL(); para.push(inline(line)); }
    });
    flushP(); closeL();
    return html;
  }

  function addMsg(role,text){
    var d=document.createElement('div');
    d.className='msg '+(role==='user'?'user':'bot');
    if(role==='user') d.textContent=text; else d.innerHTML=md(text);
    log.appendChild(d); return d;
  }
  function scrollDown(){ window.scrollTo({top:document.body.scrollHeight}); }
  function renderStarters(){
    var box=document.createElement('div'); box.className='starters'; box.id='starters';
    var h=document.createElement('h2'); h.textContent='Start with a question'; box.appendChild(h);
    STARTERS.forEach(function(s){
      var b=document.createElement('button'); b.type='button'; b.textContent=s;
      b.onclick=function(){ send(s); }; box.appendChild(b);
    });
    log.appendChild(box);
  }
  function renderAll(){
    log.innerHTML='';
    if(!messages.length){ renderStarters(); return; }
    messages.forEach(function(m){ addMsg(m.role,m.content); });
  }
  function save(){ store.set('msgs',messages.slice(-40)); }
  function setBusy(b){ busy=b; sendBtn.disabled=b; q.disabled=b; }
  function grow(){ q.style.height='auto'; q.style.height=Math.min(q.scrollHeight,160)+'px'; }

  async function send(text){
    text=(text||'').trim();
    if(busy||!text) return;
    var st=$('#starters'); if(st) st.remove();
    setBusy(true);
    messages.push({role:'user',content:text});
    addMsg('user',text);
    var el=document.createElement('div'); el.className='msg bot';
    el.innerHTML='<span class="wait">Searching the Scriptures</span>';
    log.appendChild(el); scrollDown();
    q.value=''; grow();
    var acc='';
    try{
      var res=await fetch('/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-access-code':store.get('code','')},
        body:JSON.stringify({messages:messages.slice(-12),tradition:trad.value,translation:trans.value})
      });
      if(res.status===401){
        var code=window.prompt('Enter the access code to use this site:');
        if(code) store.set('code',code);
        throw new Error('Access code saved. Please send your question again.');
      }
      if(res.status===429){ var j=await res.json().catch(function(){return{}}); throw new Error(j.error||'Too many questions. Please try again later.'); }
      if(!res.ok||!res.body) throw new Error('Something went wrong. Please send your question again.');
      var reader=res.body.getReader(), dec=new TextDecoder(), buf='';
      for(;;){
        var r=await reader.read(); if(r.done) break;
        buf+=dec.decode(r.value,{stream:true});
        var i;
        while((i=buf.indexOf('\n\n'))>=0){
          var chunk=buf.slice(0,i); buf=buf.slice(i+2);
          if(chunk.indexOf('data: ')!==0) continue;
          var ev; try{ ev=JSON.parse(chunk.slice(6)); }catch(e){ continue; }
          if(ev.error) throw new Error(ev.error);
          if(ev.status && !acc){ el.innerHTML='<span class="wait">'+esc(ev.status.replace(/…$/,''))+'</span>'; }
          if(ev.t){ acc+=ev.t; el.innerHTML=md(acc); scrollDown(); }
        }
      }
      if(!acc.trim()) throw new Error('No answer came back. Please try again.');
      messages.push({role:'assistant',content:acc}); save();
    }catch(e){
      messages.pop(); // drop the unanswered question so roles keep alternating
      if(acc.trim()){ el.innerHTML=md(acc)+'<p class="wait">The answer was cut off. Please ask again.</p>'; }
      else{ el.classList.add('err'); el.textContent=e.message||'Something went wrong. Please try again.'; }
      q.value=text; grow();
    }finally{
      setBusy(false); q.focus();
    }
  }

  $('#composer').addEventListener('submit',function(e){ e.preventDefault(); send(q.value); });
  q.addEventListener('keydown',function(e){
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(q.value); }
  });
  q.addEventListener('input',grow);
  $('#new').onclick=function(){ if(busy) return; messages=[]; save(); renderAll(); q.focus(); };

  renderAll(); scrollDown();
})();
</script>
</body>
</html>
